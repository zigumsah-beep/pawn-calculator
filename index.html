<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>คำนวณดอกเบี้ยขายฝาก</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#faf3e3;--card:#fffaf0;--ink:#3b2a1e;--mute:#8a7561;--gold:#b8860b;--line:#e6d6b3;--accent:#4a3224;--accent-ink:#fff7e0;--ok:#2e7d32;--days:#2e7d4f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1510;--card:#2a1d15;--ink:#f3e6cc;--mute:#b09a80;--gold:#d9a93a;--line:#4a3628;--accent:#d9a93a;--accent-ink:#2a1d15;--ok:#7bc47f;--days:#5fcf8a}}
:root[data-theme="dark"]{--bg:#1e1510;--card:#2a1d15;--ink:#f3e6cc;--mute:#b09a80;--gold:#d9a93a;--line:#4a3628;--accent:#d9a93a;--accent-ink:#2a1d15;--ok:#7bc47f;--days:#5fcf8a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sarabun',system-ui,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:12px 12px 24px}
h1{font-size:18px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.card h2{font-size:13px;margin:0 0 6px;color:var(--gold)}
label{display:block;font-size:12px;color:var(--mute);margin:6px 0 2px}
input[type=date],input[type=number]{width:100%;padding:8px 10px;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:8px}
.seg label{flex:1;margin:0;cursor:pointer}
.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;padding:8px;border:1px solid var(--line);border-radius:10px;color:var(--ink);font-weight:600;background:var(--bg)}
.seg input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tabs{margin-bottom:10px}
.tabs span{font-size:16px}
.chk{display:flex;align-items:center;gap:8px;margin:0;font-size:14px;color:var(--ink)}
.chk input{width:18px;height:18px}
.row.tight{align-items:end}
.bigdays{margin-top:8px;text-align:center;font-size:15px;color:var(--mute)}
.bigdays b{font-size:40px;margin-left:6px;color:var(--days)}
.bigdays.err{font-size:13px;color:#c0392b}
table{width:100%;border-collapse:collapse}
td{padding:4px 0;font-size:14px;border-bottom:1px dashed var(--line)}
td:last-child{text-align:right;font-variant-numeric:tabular-nums}
tr.neg td:last-child{color:var(--ok)}
tr.dim td{color:var(--mute)}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;padding-top:8px;border-top:2px solid var(--gold)}
.total b{font-size:24px;color:var(--gold)}
.note{font-size:12px;color:var(--mute);margin-top:4px}
details{margin-top:8px;font-size:13px;color:var(--mute)}
summary{cursor:pointer;padding:2px 0}
</style>
</head>
<body>
<main>
<h1>คำนวณดอกเบี้ยขายฝาก</h1>
<div class="seg tabs">
<label><input type="radio" name="mode" value="redeem" checked><span>ไถ่ถอน</span></label>
<label><input type="radio" name="mode" value="renew"><span>ต่อดอก</span></label>
</div>

<div class="card">
<div class="row">
<div><label for="d1" style="margin-top:0">วันที่รับฝาก</label><input type="date" id="d1"><div class="note" id="n1"></div></div>
<div><label for="d2" id="l2" style="margin-top:0">วันที่มาไถ่ถอน</label><input type="date" id="d2"><div class="note" id="n2"></div></div>
</div>
<div class="row" id="renewBox" hidden>
<div><label for="term">กำหนด (เดือน)</label><input type="number" id="term" value="2" min="1" step="any" inputmode="decimal"></div>
<div><label for="due">วันครบกำหนด</label><input type="date" id="due"><div class="note" id="n3"></div></div>
</div>
<div class="bigdays" id="daysNote"></div>
<label for="amt">ราคารับฝาก (บาท)</label>
<input type="number" id="amt" min="0" step="any" inputmode="decimal" placeholder="เช่น 10000">
</div>

<div class="card">
<h2>ดอกเบี้ยต่อ 30 วัน</h2>
<div class="seg">
<label><input type="radio" name="rate" value="1.25" checked><span>1.25%</span></label>
<label><input type="radio" name="rate" value="2" id="rate2"><span>2%</span></label>
</div>
<div class="note" id="rateNote"></div>
<div class="row tight" style="margin-top:8px">
<div><label for="disc" style="margin-top:0">ส่วนลดดอกเบี้ย (%)</label><input type="number" id="disc" value="10" min="0" max="100" step="any" inputmode="decimal"></div>
<label class="chk" style="padding-bottom:10px"><input type="checkbox" id="useDisc" checked> ใช้ส่วนลด</label>
</div>
<div class="note" id="discNote"></div>
<details>
<summary>ตั้งค่าการนับเดือนและเงื่อนไขส่วนลด</summary>
<div class="row">
<div><label for="minAmt">ได้ส่วนลดเมื่อยอดเกิน (บาท)</label><input type="number" id="minAmt" value="10000" min="0" inputmode="numeric"></div>
<div><label for="minDays">ได้ส่วนลดเมื่อเกิน (วัน)</label><input type="number" id="minDays" value="15" min="0" inputmode="numeric"></div>
</div>
<div class="row">
<div><label for="per">รอบคิด (วัน)</label><input type="number" id="per" value="30" min="1" inputmode="numeric"></div>
<div><label for="thr">เศษเกิน … วัน = เต็มเดือน</label><input type="number" id="thr" value="15" min="0" inputmode="numeric"></div>
</div>
<label class="chk" style="margin-top:8px"><input type="checkbox" id="half" checked> ไถ่ถอน: เศษไม่เกินเกณฑ์ คิดครึ่งเดือน</label>
</details>
</div>

<div class="card">
<table><tbody id="rows"></tbody></table>
<div class="total"><span id="tLbl">ยอดไถ่ถอนรวม</span><b id="rTotal">-</b></div>
<div class="note" id="rExplain"></div>
</div>
</main>

<script>
const $=id=>document.getElementById(id);
const fmt=n=>n.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const utc=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};
const th=s=>{const [y,m,d]=s.split('-');return d+'/'+m+'/'+(+y+543)};
function addMonths(s,n){
  const [y,m,d]=s.split('-').map(Number);
  const whole=Math.floor(n),last=new Date(Date.UTC(y,m+whole,0)).getUTCDate();
  const dt=new Date(Date.UTC(y,m-1+whole,Math.min(d,last)));
  return dt.getUTCFullYear()+'-'+String(dt.getUTCMonth()+1).padStart(2,'0')+'-'+String(dt.getUTCDate()).padStart(2,'0');
}
$('d1').value=ymd(new Date());$('d2').value=ymd(new Date());
function syncDue(){const t=parseFloat($('term').value)||0;if($('d1').value)$('due').value=addMonths($('d1').value,t)}
syncDue();

function calc(){
  const mode=document.querySelector('input[name=mode]:checked').value,renew=mode==='renew';
  $('renewBox').hidden=!renew;
  $('l2').textContent=renew?'วันที่มาต่อดอก':'วันที่มาไถ่ถอน';
  $('tLbl').textContent=renew?'ยอดต่อดอก (ดอกเบี้ยที่ต้องจ่าย)':'ยอดไถ่ถอนรวม';
  const a=$('d1').value,b=$('d2').value,due=$('due').value;
  const tl=v=>{if(!v)return '';const [y,m,d]=v.split('-').map(Number);return d+' '+MN[m-1]+' '+(y+543)};
  $('n1').textContent=tl(a);$('n2').textContent=tl(b);$('n3').textContent=renew?tl(due):'';
  const amt=parseFloat($('amt').value)||0;
  const big=amt>=100000;
  if(big)document.querySelector('input[name=rate][value="1.25"]').checked=true;
  $('rate2').disabled=big;
  $('rateNote').textContent=big?'ยอดตั้งแต่ 100,000 บาทขึ้นไป ใช้ดอกเบี้ย 1.25% อัตโนมัติ':'';
  const rate=parseFloat(document.querySelector('input[name=rate]:checked').value);
  const per=Math.max(1,parseFloat($('per').value)||30);
  const thr=Math.max(0,parseFloat($('thr').value)||0);
  const minAmt=parseFloat($('minAmt').value)||0,minDays=parseFloat($('minDays').value)||0;
  const discPct=Math.min(100,Math.max(0,parseFloat($('disc').value)||0));
  const dn=$('daysNote');dn.className='bigdays';
  if(!a||!b||(renew&&!due)){dn.textContent='';return}
  const rows=[];const add=(l,v,c)=>rows.push('<tr class="'+(c||'')+'"><td>'+l+'</td><td>'+v+'</td></tr>');
  let months,days,ex='',discDays;
  if(!renew){
    days=Math.round((utc(b)-utc(a))/86400000);
    if(days<0){dn.className='bigdays err';dn.textContent='วันที่ไถ่ถอนต้องไม่ก่อนวันที่รับฝาก';days=0}
    else dn.innerHTML='ครบกำหนด<b>'+days+' วัน</b>';
    const full=Math.floor(days/per),rem=days%per;
    months=full;
    if(rem>thr)months+=1;else if(rem>0&&$('half').checked)months+=0.5;
    if(days>0&&months===0)months=0.5;
    discDays=days;
    ex=days+' วัน = '+full+' รอบ + เศษ '+rem+' วัน → '+months+' เดือน';
    add('จำนวนวัน',days+' วัน');add('เดือนที่คิดดอกเบี้ย',months+' เดือน');
  }else{
    const term=parseFloat($('term').value)||0;
    const od=Math.round((utc(b)-utc(due))/86400000);
    discDays=Math.round((utc(due)-utc(a))/86400000);
    const extra=od>0?Math.floor(od/per)+((od%per)>thr?1:0):0;
    months=term+extra;
    const bs='style="display:block;margin:0;font-size:34px"';
    dn.innerHTML='<div style="display:flex;justify-content:space-around"><div>ตามกำหนด<b '+bs+'>'+discDays+' วัน</b></div><div>'+(od<0?'เหลืออีก':'เลยกำหนด')+'<b '+bs+'>'+Math.abs(od)+' วัน</b></div></div>';
    ex='กำหนด '+term+' เดือน'+(extra?' + เลยกำหนด '+od+' วัน เพิ่ม '+extra+' เดือน':(od>0?' (เลยไม่เกิน '+thr+' วัน ไม่คิดเพิ่ม)':''))+' = '+months+' เดือน';
    add('วันครบกำหนด',th(due));
    add('ตามกำหนด',discDays+' วัน ('+term+' เดือน)');
    add('เลยกำหนด',od>0?od+' วัน'+(extra?' (+'+extra+' เดือน)':' (ไม่คิดเพิ่ม)'):(od<0?'ยังไม่เลย (อีก '+(-od)+' วัน)':'0 วัน'));
    add('เดือนที่คิดดอกเบี้ย',months+' เดือน');
  }
  const okAmt=amt>minAmt,okDays=discDays>minDays;
  const disc=($('useDisc').checked&&okAmt&&okDays)?discPct:0;
  const why=[];
  if($('useDisc').checked){if(!okAmt)why.push('ยอดไม่เกิน '+minAmt.toLocaleString('th-TH')+' บาท');if(!okDays)why.push('ระยะเวลาไม่เกิน '+minDays+' วัน')}
  $('discNote').textContent=why.length?'ไม่ได้ส่วนลด: '+why.join(' และ '):'';
  const interest=amt*rate/100*months,dAmt=interest*disc/100,net=interest-dAmt;
  add(renew?'ราคารับฝาก (ไม่ต้องจ่าย)':'ราคารับฝาก',fmt(amt),renew?'dim':'');
  add('ดอกเบี้ยก่อนลด',fmt(interest));
  add('ส่วนลดดอกเบี้ย '+disc+'%','-'+fmt(dAmt),'neg');
  add('ดอกเบี้ยสุทธิ',fmt(net));
  $('rows').innerHTML=rows.join('');
  $('rTotal').textContent=fmt(renew?net:amt+net)+' บาท';
  $('rExplain').textContent=ex+' × '+rate+'% × '+fmt(amt)+(renew?' (เงินต้นยังคงอยู่)':'');
}

const MN=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
document.querySelectorAll('input').forEach(e=>{
  const h=()=>{if(e.id==='d1'||e.id==='term')syncDue();calc()};
  e.addEventListener('input',h);e.addEventListener('change',h);
});
calc();
</script>
</body>
</html>
