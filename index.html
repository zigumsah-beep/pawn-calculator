<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>คำนวณดอกเบี้ยขายฝาก</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#faf3e3;--card:#fffaf0;--ink:#3b2a1e;--mute:#8a7561;--gold:#b8860b;--line:#e6d6b3;--accent:#4a3224;--accent-ink:#fff7e0;--ok:#2e7d32;--days:#2e7d4f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1510;--card:#2a1d15;--ink:#f3e6cc;--mute:#b09a80;--gold:#d9a93a;--line:#4a3628;--accent:#d9a93a;--accent-ink:#2a1d15;--ok:#7bc47f;--days:#5fcf8a}}
:root[data-theme="dark"]{--bg:#1e1510;--card:#2a1d15;--ink:#f3e6cc;--mute:#b09a80;--gold:#d9a93a;--line:#4a3628;--accent:#d9a93a;--accent-ink:#2a1d15;--ok:#7bc47f;--days:#5fcf8a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sarabun',system-ui,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mute);font-size:14px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--gold)}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
input[type=date],input[type=number]{width:100%;padding:10px 12px;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:8px}
.seg label{flex:1;margin:0;cursor:pointer}
.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;padding:10px;border:1px solid var(--line);border-radius:10px;color:var(--ink);font-weight:600;background:var(--bg)}
.seg input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chk{display:flex;align-items:center;gap:8px;margin:10px 0 0;color:var(--ink)}
.chk input{width:18px;height:18px}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:7px 0;border-bottom:1px dashed var(--line)}
td:last-child{text-align:right;font-variant-numeric:tabular-nums}
tr.neg td:last-child{color:var(--ok)}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding-top:12px;border-top:2px solid var(--gold)}
.total b{font-size:26px;color:var(--gold)}
.bigdays{margin-top:14px;text-align:center;font-size:20px;color:var(--mute)}
.bigdays b{display:block;font-size:56px;line-height:1.1;color:var(--gold)}
.bigdays.err{font-size:15px;color:#c0392b}
.note{font-size:13px;color:var(--mute);margin-top:8px}

main{padding:12px 12px 24px}
h1{font-size:18px;margin:0 0 10px}
.card{padding:12px;margin-bottom:10px;border-radius:12px}
.card h2{font-size:13px;margin:0 0 6px}
label{font-size:12px;margin:6px 0 2px}
input[type=date],input[type=number]{padding:8px 10px;font-size:16px}
.seg span{padding:8px}
.bigdays{margin-top:8px;font-size:15px}
.bigdays b{display:inline;font-size:40px;margin-left:6px;color:var(--days)}
.bigdays.err{font-size:13px}
td{padding:4px 0;font-size:14px}
.total b{font-size:24px}
.total{margin-top:8px;padding-top:8px}
.note{font-size:12px;margin-top:4px}
.chk{font-size:14px;margin:0}
.row.tight{align-items:end}
details{margin-top:8px;font-size:13px;color:var(--mute)}
summary{cursor:pointer;padding:2px 0}
</style>
</head>
<body>
<main>
<h1>คำนวณดอกเบี้ยขายฝาก</h1>

<div class="card">
<div class="row">
<div><label for="d1" style="margin-top:0">วันที่รับฝาก</label><input type="date" id="d1"></div>
<div><label for="d2" style="margin-top:0">วันที่ไถ่ถอน</label><input type="date" id="d2"></div>
</div>
<div class="bigdays" id="daysNote"></div>
<label for="amt">ราคารับฝาก (บาท)</label>
<input type="number" id="amt" min="0" step="any" inputmode="decimal" placeholder="เช่น 10000">
</div>

<div class="card">
<h2>ดอกเบี้ยต่อ 30 วัน</h2>
<div class="seg">
<label><input type="radio" name="rate" value="1.25" checked><span>1.25%</span></label>
<label><input type="radio" name="rate" value="2" id="rate2"><span>2%</span></label>
</div>
<div class="note" id="rateNote"></div>
<div class="row tight" style="margin-top:8px">
<div><label for="disc" style="margin-top:0">ส่วนลดดอกเบี้ย (%)</label><input type="number" id="disc" value="10" min="0" max="100" step="any" inputmode="decimal"></div>
<label class="chk" style="padding-bottom:10px"><input type="checkbox" id="useDisc" checked> ใช้ส่วนลด</label>
</div>
<div class="note" id="discNote"></div>
<details>
<summary>ตั้งค่าการนับเดือนและเงื่อนไขส่วนลด</summary>
<div class="row">
<div><label for="minAmt">ได้ส่วนลดเมื่อยอดเกิน (บาท)</label><input type="number" id="minAmt" value="10000" min="0" inputmode="numeric"></div>
<div><label for="minDays">ได้ส่วนลดเมื่อเกิน (วัน)</label><input type="number" id="minDays" value="15" min="0" inputmode="numeric"></div>
</div>
<div class="row">
<div><label for="per">รอบคิด (วัน)</label><input type="number" id="per" value="30" min="1" inputmode="numeric"></div>
<div><label for="thr">เศษเกิน … วัน = เต็มเดือน</label><input type="number" id="thr" value="15" min="0" inputmode="numeric"></div>
</div>
<label class="chk" style="margin-top:8px"><input type="checkbox" id="half" checked> เศษไม่เกินเกณฑ์ คิดครึ่งเดือน</label>
</details>
</div>

<div class="card">
<table>
<tr><td>จำนวนวัน</td><td id="rDays">-</td></tr>
<tr><td>เดือนที่คิดดอกเบี้ย</td><td id="rMonths">-</td></tr>
<tr><td>ราคารับฝาก</td><td id="rAmt">-</td></tr>
<tr><td>ดอกเบี้ยก่อนลด</td><td id="rInt">-</td></tr>
<tr class="neg"><td id="rDiscLbl">ส่วนลดดอกเบี้ย</td><td id="rDisc">-</td></tr>
<tr><td>ดอกเบี้ยสุทธิ</td><td id="rNet">-</td></tr>
</table>
<div class="total"><span>ยอดไถ่ถอนรวม</span><b id="rTotal">-</b></div>
<div class="note" id="rExplain"></div>
</div>
</main>

<script>
const $=id=>document.getElementById(id);
const fmt=n=>n.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const utc=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};
$('d1').value=ymd(new Date());$('d2').value=ymd(new Date());

function calc(){
  const a=$('d1').value,b=$('d2').value;
  const amt=parseFloat($('amt').value)||0;
  const big=amt>=100000;
  if(big)document.querySelector('input[name=rate][value="1.25"]').checked=true;
  $('rate2').disabled=big;
  $('rateNote').textContent=big?'ยอดตั้งแต่ 100,000 บาทขึ้นไป ใช้ดอกเบี้ย 1.25% อัตโนมัติ':'';
  const rate=parseFloat(document.querySelector('input[name=rate]:checked').value);
  const per=Math.max(1,parseFloat($('per').value)||30);
  const thr=Math.max(0,parseFloat($('thr').value)||0);
  const minAmt=parseFloat($('minAmt').value)||0,minDays=parseFloat($('minDays').value)||0;
  const discPct=Math.min(100,Math.max(0,parseFloat($('disc').value)||0));
  let days=0,valid=a&&b;
  if(valid){days=Math.round((utc(b)-utc(a))/86400000)}
  if(!valid){$('daysNote').textContent='';return}
  $('daysNote').className='bigdays';
  if(days<0){$('daysNote').className='bigdays err';$('daysNote').textContent='วันที่ไถ่ถอนต้องไม่ก่อนวันที่รับฝาก';days=0}
  else $('daysNote').innerHTML='ครบกำหนด<b>'+days+' วัน</b>';
  const okAmt=amt>minAmt,okDays=days>minDays;
  const disc=($('useDisc').checked&&okAmt&&okDays)?discPct:0;
  let why=[];
  if($('useDisc').checked){if(!okAmt)why.push('ยอดไม่เกิน '+minAmt.toLocaleString('th-TH')+' บาท');if(!okDays)why.push('ระยะเวลาไม่เกิน '+minDays+' วัน')}
  $('discNote').textContent=why.length?'ไม่ได้ส่วนลด: '+why.join(' และ '):'';
  const full=Math.floor(days/per),rem=days%per;
  let months=full;
  if(rem>thr)months+=1;
  else if(rem>0&&$('half').checked)months+=0.5;
  if(days>0&&months===0)months=0.5;
  const interest=amt*rate/100*months;
  const dAmt=interest*disc/100;
  const net=interest-dAmt;
  $('rDays').textContent=days+' วัน';
  $('rMonths').textContent=months+' เดือน';
  $('rAmt').textContent=fmt(amt);
  $('rInt').textContent=fmt(interest);
  $('rDiscLbl').textContent='ส่วนลดดอกเบี้ย '+disc+'%';
  $('rDisc').textContent='-'+fmt(dAmt);
  $('rNet').textContent=fmt(net);
  $('rTotal').textContent=fmt(amt+net)+' บาท';
  $('rExplain').textContent=days+' วัน = '+full+' รอบ + เศษ '+rem+' วัน → '+months+' เดือน × '+rate+'% × '+fmt(amt);
}
document.querySelectorAll('input').forEach(e=>{e.addEventListener('input',calc);e.addEventListener('change',calc)});
calc();
</script>
</body>
</html>
